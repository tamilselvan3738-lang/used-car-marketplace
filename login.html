  <!-- Motion (Official Framer Motion engine for Vanilla / Modern Web) -->

  <style>
    /* Guaranteed Sticky Header Navigation across all viewports */
    header.sticky, header[class*="sticky"] {
      position: -webkit-sticky !important;
      position: sticky !important;
      top: 0.5rem !important;
      z-index: 50 !important;
    }

    *, *::before, *::after {
      box-sizing: border-box !important;
    }
        /* ========================================================================= */
    /* MASTER MOBILE-FIRST RESPONSIVE ENGINE & BREAKPOINT ARCHITECTURE           */
    /* BREAKPOINTS: 320px (Compact Mobile), 480px (Mobile), 768px (Tablet),     */
    /*              1024px (Small Laptop / Desktop Transition)                   */
    /* ========================================================================= */

    /* 1. Global Box-Sizing & Viewport Boundary Lock */
    *, *::before, *::after {
      box-sizing: border-box !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }

    html {
      box-sizing: border-box !important;
      overflow-x: hidden !important;
      max-width: 100vw !important;
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      box-sizing: border-box !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      max-width: 100vw !important;
      width: 100% !important;
      position: relative !important;
      margin: 0 !important;
      padding: 0 !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
    }

    /* 2. Guaranteed Sticky Header Navigation across all viewports */
    header.sticky, header[class*="sticky"] {
      position: -webkit-sticky !important;
      position: sticky !important;
      top: 0.5rem !important;
      z-index: 50 !important;
      overflow: visible !important;
      max-width: 100vw !important;
    }

    /* 3. Universal Media & Container Bounds: Resize Fluidly */
    img, picture, video, canvas, svg {
      max-width: 100% !important;
      height: auto;
    }

    /* 4. Prevent Horizontal Overflow in Sections & Wrappers */
    section, main, article, footer {
      max-width: 100vw !important;
      box-sizing: border-box !important;
      overflow-x: hidden;
      width: 100% !important;
    }

    /* Header & dropdown menus must remain visible */
    header, #site-header, #top-nav-header {
      overflow: visible !important;
      max-width: 100vw !important;
    }

    /* 5. Text Containment & Anti-Overflow */
    h1, h2, h3, h4, h5, h6, p, span, a, label, button, input, select, textarea {
      overflow-wrap: break-word !important;
      word-wrap: break-word !important;
      word-break: break-word;
    }

    /* Container fluid max bounds */
    .container, .mx-auto {
      max-width: 100% !important;
      box-sizing: border-box !important;
    }

    /* ========================================================================= */
    /* BREAKPOINT: 1024px (Tablets Landscape, Laptops, Mobile Menus)             */
    /* ========================================================================= */
    @media (max-width: 1024px) {
      /* Navbar Collapses into Mobile Menu */
      #desktop-nav {
        display: none !important;
      }
      #hamburger-btn, .mobile-toggle-btn {
        display: flex !important;
      }

      /* Dashboard Sidebar Collapses into Drawer */
      #admin-sidebar, #user-sidebar, aside.sidebar {
        display: none !important;
      }
      main.dashboard-main, #main-content {
        margin-left: 0 !important;
        margin-right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;
      }

      /* Equal Section Vertical Spacing (1024px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 3.5rem !important;
        padding-bottom: 3.5rem !important;
      }

      /* Container Horizontal Padding */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"] {
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;
        width: 100% !important;
      }

      /* Tables Horizontal Touch Scroll */
      .table-responsive, [class*="overflow-x-auto"] {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* ========================================================================= */
    /* BREAKPOINT: 768px (Tablets Portrait & Large Phones)                       */
    /* ========================================================================= */
    @media (max-width: 768px) {
      /* Equal Section Vertical Spacing (768px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 2.75rem !important;
        padding-bottom: 2.75rem !important;
      }

      /* Container Horizontal Padding */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"] {
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }

      /* Cards Stack Vertically on Small Screens */
      .grid.md\:grid-cols-2,
      .grid.md\:grid-cols-3,
      .grid.md\:grid-cols-4,
      .grid.lg\:grid-cols-2,
      .grid.lg\:grid-cols-3,
      .grid.lg\:grid-cols-4,
      .grid.xl\:grid-cols-3,
      .grid.xl\:grid-cols-4 {
        grid-template-columns: 1fr !important;
      }

      /* Flex Containers Stack Vertically */
      .md\:flex-row,
      .lg\:flex-row {
        flex-direction: column !important;
      }

      /* Responsive Typography (768px) */
      h1 {
        font-size: clamp(1.55rem, 5.2vw, 2.15rem) !important;
        line-height: 1.22 !important;
      }
      h2 {
        font-size: clamp(1.25rem, 4.4vw, 1.65rem) !important;
        line-height: 1.25 !important;
      }
      h3 {
        font-size: clamp(1.08rem, 3.8vw, 1.35rem) !important;
        line-height: 1.3 !important;
      }

      /* Buttons Group Stack */
      .btn-responsive-group {
        flex-direction: column !important;
        width: 100% !important;
      }
      .btn-responsive-group > * {
        width: 100% !important;
      }
    }

    /* ========================================================================= */
    /* BREAKPOINT: 480px (Standard Mobile Phones)                                */
    /* ========================================================================= */
    @media (max-width: 480px) {
      /* Equal Section Vertical Spacing (480px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 2rem !important;
        padding-bottom: 2rem !important;
      }

      /* Container Horizontal Padding */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"] {
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
      }

      /* Responsive Typography (480px) */
      h1 {
        font-size: clamp(1.35rem, 6.2vw, 1.8rem) !important;
        line-height: 1.2 !important;
        letter-spacing: -0.01em !important;
      }
      h2 {
        font-size: clamp(1.15rem, 5.2vw, 1.45rem) !important;
        line-height: 1.25 !important;
      }
      h3 {
        font-size: clamp(1.0rem, 4.2vw, 1.22rem) !important;
        line-height: 1.28 !important;
      }
      p, span {
        font-size: 0.875rem;
      }

      /* Buttons fit mobile screens without overflow */
      button, a.btn-3d, .btn-3d-primary, .btn-3d-gold, .btn-3d-glass {
        max-width: 100% !important;
        word-break: normal !important;
      }
      .mobile-full-btn {
        width: 100% !important;
        justify-content: center !important;
      }

      /* Form inputs full width + min 16px to prevent iOS auto-zoom */
      input:not([type="checkbox"]):not([type="radio"]), select, textarea {
        font-size: 16px !important;
        max-width: 100% !important;
        width: 100% !important;
      }

      /* Compact Card Padding */
      .card-compact-mobile, [class*="p-6"], [class*="p-8"] {
        padding: 1rem !important;
      }

      /* Mobile Drawer Bounds */
      #mobile-drawer {
        width: 100% !important;
        max-width: 100vw !important;
      }
    }

    /* ========================================================================= */
    /* BREAKPOINT: 320px (Ultra-Compact Mobile Phones)                           */
    /* ========================================================================= */
    @media (max-width: 320px) {
      /* Equal Section Vertical Spacing (320px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 1.5rem !important;
        padding-bottom: 1.5rem !important;
      }

      /* Ultra-Compact Container Bounds */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"], section, body {
        padding-left: 0.5rem !important;
        padding-right: 0.5rem !important;
      }

      /* Ultra-Compact Typography */
      h1 {
        font-size: 1.22rem !important;
        line-height: 1.2 !important;
      }
      h2 {
        font-size: 1.05rem !important;
        line-height: 1.22 !important;
      }
      h3 {
        font-size: 0.95rem !important;
        line-height: 1.25 !important;
      }
      p, span {
        font-size: 0.8rem !important;
      }

      /* Scale Header Logo */
      .logo-brand-subtext {
        display: none !important;
      }
      .logo-container {
        transform: scale(0.88);
        transform-origin: left center;
      }
      [dir="rtl"] .logo-container {
        transform-origin: right center;
      }

      /* Buttons Full Width */
      button, a.btn-3d, .btn-3d-primary, .btn-3d-gold {
        width: 100% !important;
        padding-left: 0.5rem !important;
        padding-right: 0.5rem !important;
        font-size: 11px !important;
      }

      /* Card inner padding */
      [class*="p-4"], [class*="p-5"], [class*="p-6"] {
        padding: 0.75rem !important;
      }
    }

    /* ========================================================================= */
    /* RTL & THEMING ALIGNMENT GUARDS                                            */
    /* ========================================================================= */
    [dir="rtl"] .rtl-flip {
      transform: scaleX(-1) !important;
    }
    [dir="rtl"] .space-x-reverse > :not([hidden]) ~ :not([hidden]) {
      --tw-space-x-reverse: 1 !important;
    }

    
  </style>
</head>

        <!-- Field 2: Password with Show/Hide Eye Toggle -->
        <div class="space-y-1 text-left rtl:text-right">

            <input

              <!-- Eye Open (Hide Password) -->
              <svg id="eye-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>

        <!-- Remember Me & Forgot Password Row (Matching Reference) -->
        <div class="flex items-center justify-between text-[11px] sm:text-xs pt-0.5">

            <input

          <a href="#" onclick="alert('[Password Reset] Password recovery instructions have been dispatched to your email.'); return false;" class="text-amber-600 dark:text-amber-400 hover:text-amber-500 font-semibold transition-colors">
            Forgot Password?

        </div>

        <!-- Primary Golden Luxury 3D Action Button (Matching Reference Image) -->
        <button 
          id="login-submit-btn" 
          type="submit" 
          class="btn-3d-gold w-full py-2.5 sm:py-3 rounded-xl text-slate-950 font-black text-xs sm:text-sm tracking-wide flex items-center justify-center space-x-2 rtl:space-x-reverse cursor-pointer shadow-lg transition-transform"
        >
          <!-- Lock Icon -->
          <svg class="w-3.5 h-3.5 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <span id="login-btn-text">Log In to Dashboard</span>
        </button>

      </form>

      <!-- Horizontal Divider: "OR CONTINUE WITH" -->
      <div class="relative flex items-center justify-center pt-1">
        <div class="border-t border-slate-200 dark:border-slate-800 w-full"></div>
        <span class="bg-white dark:bg-[#0c1322] px-2.5 text-[9.5px] sm:text-[10px] font-mono tracking-widest text-slate-400 dark:text-slate-500 uppercase flex-shrink-0">
          OR CONTINUE WITH
        </span>
        <div class="border-t border-slate-200 dark:border-slate-800 w-full"></div>
      </div>

      <!-- Social Logins Row: Google, Facebook, Apple (Matching Reference) -->
      <div class="grid grid-cols-3 gap-2 sm:gap-2.5">
        
        <!-- Google Button -->
        <button 
          type="button" 
          onclick="handleSocialLogin('Google')" 
          class="py-2 rounded-xl bg-slate-100/80 hover:bg-slate-200 dark:bg-slate-900/80 dark:hover:bg-slate-800 border border-slate-300/80 dark:border-slate-700/80 hover:border-cyan-400/50 flex items-center justify-center transition-all cursor-pointer group"
          title="Sign in with Google"
          aria-label="Sign in with Google"
        >
          <!-- Google 'G' SVG -->
          <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </button>

        <!-- Facebook Button -->
        <button 
          type="button" 
          onclick="handleSocialLogin('Facebook')" 
          class="py-2 rounded-xl bg-slate-100/80 hover:bg-slate-200 dark:bg-slate-900/80 dark:hover:bg-slate-800 border border-slate-300/80 dark:border-slate-700/80 hover:border-blue-500/50 flex items-center justify-center transition-all cursor-pointer group"
          title="Sign in with Facebook"
          aria-label="Sign in with Facebook"
        >
          <!-- Facebook 'f' SVG -->
          <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-[#1877F2] group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>

        <!-- Apple Button -->
        <button 
          type="button" 
          onclick="handleSocialLogin('Apple')" 
          class="py-2 rounded-xl bg-slate-100/80 hover:bg-slate-200 dark:bg-slate-900/80 dark:hover:bg-slate-800 border border-slate-300/80 dark:border-slate-700/80 hover:border-slate-400 flex items-center justify-center transition-all cursor-pointer group"
          title="Sign in with Apple"
          aria-label="Sign in with Apple"
        >
          <!-- Apple Logo SVG -->
          <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-slate-900 dark:text-white group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.64 1.35-.57.65-1.07 1.72-.94 2.74 1.02.08 2.04-.49 2.66-1.24z"/>
          </svg>
        </button>

      </div>

      <!-- Secondary Action: Create New Account Button -->
      <a 
        href="registeration.html" 
        class="w-full py-2 sm:py-2.5 rounded-xl bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60 border border-slate-300 dark:border-slate-700/90 hover:border-amber-500 dark:hover:border-amber-400/60 text-slate-800 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white font-bold text-xs tracking-wide flex items-center justify-center space-x-1.5 rtl:space-x-reverse transition-all cursor-pointer"
      >
        <span>Create New Account</span>
        <svg class="w-3.5 h-3.5 rtl:rotate-180 text-amber-500 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>

      <!-- Security Trust Footer Badge (Matching Reference) -->
      <div class="flex items-center justify-center space-x-1.5 rtl:space-x-reverse text-cyan-600 dark:text-cyan-400 text-[10px] sm:text-[11px] font-medium pt-0.5">
        <svg class="w-3.5 h-3.5 text-cyan-600 dark:text-cyan-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>256-Bit SSL Encrypted & Bank-Grade Secure</span>
      </div>

    </div>

  </main>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT LOGIC: THEME TOGGLES, PASSWORD SHOW/HIDE, & MOTION SUITE       -->
  <!-- ========================================================================= -->
  <script>
    // --- 1. Audio Haptic Click Synthesizer (Native Web Audio API from about.html) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    // --- 2. Dark / Light Mode Toggle Management (Synchronized with localStorage) ---
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');

    function updateThemeUI(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        if (sunIcon) sunIcon.classList.remove('hidden');
        if (moonIcon) moonIcon.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        if (sunIcon) sunIcon.classList.add('hidden');
        if (moonIcon) moonIcon.classList.remove('hidden');
      }
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    updateThemeUI(savedTheme === 'dark');

    if (darkModeToggle) {
      darkModeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeUI(isDark);
        playClickSound();

        if (window.Motion && window.Motion.animate) {
          window.Motion.animate(darkModeToggle, {
            rotate: [0, -15, 15, 0],
            scale: [1, 0.9, 1.05, 1]
          }, { duration: 0.35 });
        }
      });
    }

    // --- 3. Right-to-Left (RTL) Toggle Management (Synchronized with localStorage) ---
    const rtlToggle = document.getElementById('rtl-toggle');

    function updateRtlUI(isRtl) {
      document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    }

    const savedDir = localStorage.getItem('dir') || 'ltr';
    updateRtlUI(savedDir === 'rtl');

    if (rtlToggle) {
      rtlToggle.addEventListener('click', () => {
        const currentDir = document.documentElement.getAttribute('dir') || 'ltr';
        const isRtl = currentDir === 'ltr';
        document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
        localStorage.setItem('dir', isRtl ? 'rtl' : 'ltr');
        updateRtlUI(isRtl);
        playClickSound();

        if (window.Motion && window.Motion.animate) {
          window.Motion.animate(rtlToggle, {
            rotate: [0, 180],
            scale: [1, 0.9, 1.05, 1]
          }, { duration: 0.35 });
        }
      });
    }

    // --- 4. Password Visibility Toggle (Show / Hide Password) ---
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('login-password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        if (eyeIcon && eyeOffIcon) {
          if (isPassword) {
            eyeIcon.classList.add('hidden');
            eyeOffIcon.classList.remove('hidden');
          } else {
            eyeIcon.classList.remove('hidden');
            eyeOffIcon.classList.add('hidden');
          }
        }
        playClickSound();
      });
    }

    // --- 5. Form Submission Simulation & Feedback ---
    function handleLoginSubmit() {
      const username = document.getElementById('login-username').value;
      const btn = document.getElementById('login-submit-btn');
      const text = document.getElementById('login-btn-text');

      playClickSound();

      btn.disabled = true;
      text.textContent = 'Authenticating Client...';

      setTimeout(() => {
        btn.disabled = false;
        text.textContent = 'Welcome, ' + (username.split('@')[0] || 'Member') + '!';
        btn.classList.add('bg-emerald-500');

        setTimeout(() => {
          if (username.toLowerCase().includes('admin')) {
            alert('[Access Granted] Welcome to AutoNexus Operations Console!');
            window.location.href = 'admin-dashboard.html';
          } else {
            alert('[Access Granted] Authentication verified! Redirecting to your AutoNexus User Dashboard.');
            window.location.href = 'user-dashboard.html';
          }
        }, 300);
      }, 700);
    }

    // --- 6. Social Login Simulation ---
    function handleSocialLogin(provider) {
      playClickSound();
      alert(`[${provider} Single Sign-On] Connecting to ${provider} OAuth2 gateway... Handshake successful!`);
    }

    // --- 7. Framer Motion Entrance Animation Suite ---
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Motion && window.Motion.animate) {
        const { animate, spring } = window.Motion;

        // Animate Login Card Entrance
        animate('#login-card', {
          opacity: [0, 1],
          transform: ['scale(0.92) translateY(24px)', 'scale(1) translateY(0px)']
        }, {
          duration: 0.65,
          easing: spring({ stiffness: 240, damping: 20 })
        });

        // Stagger Form Controls
        animate('#login-form > div', {
          opacity: [0, 1],
          transform: ['translateY(12px)', 'translateY(0px)']
        }, {
          delay: window.Motion.stagger(0.08, { start: 0.2 }),
          duration: 0.45
        });
      }
    });
  </script>
