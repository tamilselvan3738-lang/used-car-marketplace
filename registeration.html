      overflow-y: auto !important;

      word-wrap: break-word !important;

    }

    /* Container fluid max bounds */
    .container, .mx-auto {
      max-width: 100% !important;
      box-sizing: border-box !important;
    }

    /* ========================================================================= */
    /* BREAKPOINT: 1024px (Tablets Landscape, Laptops, Mobile Menus)             */
    /* ========================================================================= */

      #desktop-nav {
        display: none !important;
      }
      #hamburger-btn, .mobile-toggle-btn {
        display: flex !important;
      }

      /* Dashboard Sidebar Collapses into Drawer */

        display: none !important;
      }

        margin-left: 0 !important;
        margin-right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;
      }

      /* Equal Section Vertical Spacing (1024px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 3.5rem !important;
        padding-bottom: 3.5rem !important;
      }

      /* Container Horizontal Padding */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"] {
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;

        width: 100% !important;
        max-width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* ========================================================================= */
    /* BREAKPOINT: 768px (Tablets Portrait & Large Phones)                       */
    /* ========================================================================= */
    @media (max-width: 768px) {
      /* Equal Section Vertical Spacing (768px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 2.75rem !important;
        padding-bottom: 2.75rem !important;
      }

      /* Container Horizontal Padding */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"] {
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }

      /* Cards Stack Vertically on Small Screens */
      .grid.md\:grid-cols-2,
      .grid.md\:grid-cols-3,
      .grid.md\:grid-cols-4,
      .grid.lg\:grid-cols-2,
      .grid.lg\:grid-cols-3,
      .grid.lg\:grid-cols-4,
      .grid.xl\:grid-cols-3,
      .grid.xl\:grid-cols-4 {
        grid-template-columns: 1fr !important;
      }

      /* Flex Containers Stack Vertically */
      .md\:flex-row,
      .lg\:flex-row {
        flex-direction: column !important;
      }

      /* Responsive Typography (768px) */
      h1 {
        font-size: clamp(1.55rem, 5.2vw, 2.15rem) !important;
        line-height: 1.22 !important;
      }
      h2 {
        font-size: clamp(1.25rem, 4.4vw, 1.65rem) !important;
        line-height: 1.25 !important;
      }
      h3 {
        font-size: clamp(1.08rem, 3.8vw, 1.35rem) !important;
        line-height: 1.3 !important;
      }

      /* Buttons Group Stack */
      .btn-responsive-group {
        flex-direction: column !important;
        width: 100% !important;
      }
      .btn-responsive-group > * {
        width: 100% !important;
      }
    }

    /* ========================================================================= */
    /* BREAKPOINT: 480px (Standard Mobile Phones)                                */
    /* ========================================================================= */
    @media (max-width: 480px) {
      /* Equal Section Vertical Spacing (480px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 2rem !important;
        padding-bottom: 2rem !important;

      /* Container Horizontal Padding */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"] {
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
      }

      /* Responsive Typography (480px) */
      h1 {
        font-size: clamp(1.35rem, 6.2vw, 1.8rem) !important;
        line-height: 1.2 !important;
        letter-spacing: -0.01em !important;
      }
      h2 {
        font-size: clamp(1.15rem, 5.2vw, 1.45rem) !important;
        line-height: 1.25 !important;
      }
      h3 {
        font-size: clamp(1.0rem, 4.2vw, 1.22rem) !important;
        line-height: 1.28 !important;
      }
      p, span {
        font-size: 0.875rem;
      }

      /* Buttons fit mobile screens without overflow */
      button, a.btn-3d, .btn-3d-primary, .btn-3d-gold, .btn-3d-glass {
        max-width: 100% !important;
        word-break: normal !important;
      }
      .mobile-full-btn {
        width: 100% !important;
        justify-content: center !important;
      }

      /* Form inputs full width + min 16px to prevent iOS auto-zoom */
      input:not([type="checkbox"]):not([type="radio"]), select, textarea {
        font-size: 16px !important;
        max-width: 100% !important;
        width: 100% !important;
      }

      /* Compact Card Padding */
      .card-compact-mobile, [class*="p-6"], [class*="p-8"] {
        padding: 1rem !important;
      }

      /* Mobile Drawer Bounds */
      #mobile-drawer {
        width: 100% !important;
        max-width: 100vw !important;
      }
    }

    /* ========================================================================= */
    /* BREAKPOINT: 320px (Ultra-Compact Mobile Phones)                           */
    /* ========================================================================= */
    @media (max-width: 320px) {
      /* Equal Section Vertical Spacing (320px) */
      section, [id^="sec-"], [id*="-section"] {
        padding-top: 1.5rem !important;
        padding-bottom: 1.5rem !important;
      }

      /* Ultra-Compact Container Bounds */
      .container, [class*="max-w-7xl"], [class*="max-w-[1500px]"], [class*="max-w-6xl"], [class*="max-w-5xl"], section, body {
        padding-left: 0.5rem !important;
        padding-right: 0.5rem !important;
      }

      /* Ultra-Compact Typography */
      h1 {
        font-size: 1.22rem !important;
        line-height: 1.2 !important;
      }
      h2 {
        font-size: 1.05rem !important;
        line-height: 1.22 !important;
      }
      h3 {
        font-size: 0.95rem !important;
        line-height: 1.25 !important;
      }
      p, span {
        font-size: 0.8rem !important;
      }

      /* Scale Header Logo */
      .logo-brand-subtext {
        display: none !important;
      }
      .logo-container {
        transform: scale(0.88);
        transform-origin: left center;
      }
      [dir="rtl"] .logo-container {
        transform-origin: right center;
      }

      /* Buttons Full Width */
      button, a.btn-3d, .btn-3d-primary, .btn-3d-gold {
        width: 100% !important;
        padding-left: 0.5rem !important;
        padding-right: 0.5rem !important;
        font-size: 11px !important;
      }

      /* Card inner padding */
      [class*="p-4"], [class*="p-5"], [class*="p-6"] {
        padding: 0.75rem !important;
      }
    }

    /* ========================================================================= */
    /* RTL & THEMING ALIGNMENT GUARDS                                            */
    /* ========================================================================= */
    [dir="rtl"] .rtl-flip {
      transform: scaleX(-1) !important;
    }
    [dir="rtl"] .space-x-reverse > :not([hidden]) ~ :not([hidden]) {
      --tw-space-x-reverse: 1 !important;
    }

    
  
    /* ========================================================================= */
    /* LUXURY GOLD 3D PRIMARY ACTION BUTTON (HIGH CONTRAST & VISIBILITY)         */
    /* ========================================================================= */
    .btn-3d-gold {
      background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%) !important;
      color: #020617 !important;
      font-weight: 900 !important;
      box-shadow: 0 3px 0 #b45309, 0 6px 16px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.6) !important;
      border: 1px solid rgba(251, 191, 36, 0.8) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.7) !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3) !important;
      cursor: pointer !important;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }
    .btn-3d-gold:hover {
      background: linear-gradient(180deg, #fde68a 0%, #fbbf24 50%, #f59e0b 100%) !important;
      color: #020617 !important;
      box-shadow: 0 4px 0 #b45309, 0 8px 22px rgba(245, 158, 11, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important;
      transform: translateY(-1px) !important;
    }
    .btn-3d-gold:active {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%) !important;
      box-shadow: 0 1px 0 #b45309, 0 3px 8px rgba(245, 158, 11, 0.3), inset 0 1px 2px rgba(0, 0, 0, 0.15) !important;
      transform: translateY(2px) !important;
    }
    .btn-3d-gold svg {
      color: #020617 !important;
      stroke: currentColor !important;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.3));
    }
    .btn-3d-gold span, .btn-3d-gold strong {
      color: #020617 !important;
    }

    /* Membership Role Pill Radio Buttons */
    .role-pill-btn {
      transition: all 0.2s ease;

      color: #ffffff !important;
      box-shadow: 0 2px 10px rgba(14, 165, 233, 0.35) !important;
    }
  </style>
</head>

          <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-[#1877F2] group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>

        <!-- Apple Button -->
        <button 
          type="button" 
          onclick="handleSocialRegister('Apple')" 
          class="py-2 rounded-xl bg-slate-100/80 hover:bg-slate-200 dark:bg-slate-900/80 dark:hover:bg-slate-800 border border-slate-300/80 dark:border-slate-700/80 hover:border-slate-400 flex items-center justify-center transition-all cursor-pointer group"
          title="Sign up with Apple"
          aria-label="Sign up with Apple"

          <!-- Apple Logo SVG -->
          <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-slate-900 dark:text-white group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.64 1.35-.57.65-1.07 1.72-.94 2.74 1.02.08 2.04-.49 2.66-1.24z"/>
          </svg>
        </button>

      </div>

      <!-- Secondary Action: Already Registered? Go to Login -->
      <a 
        href="login.html" 
        class="w-full py-2 sm:py-2.5 rounded-xl bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60 border border-slate-300 dark:border-slate-700/90 hover:border-amber-500 dark:hover:border-amber-400/60 text-slate-800 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white font-bold text-xs tracking-wide flex items-center justify-center space-x-1.5 rtl:space-x-reverse transition-all cursor-pointer"
      >
        <span>Already have an account? <strong class="text-amber-600 dark:text-amber-400">Log In</strong></span>
        <svg class="w-3.5 h-3.5 rtl:rotate-180 text-amber-500 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>

      <!-- Security Trust Footer Badge (Matching login.html) -->
      <div class="flex items-center justify-center space-x-1.5 rtl:space-x-reverse text-cyan-600 dark:text-cyan-400 text-[10px] sm:text-[11px] font-medium pt-0.5">
        <svg class="w-3.5 h-3.5 text-cyan-600 dark:text-cyan-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>256-Bit SSL Encrypted &amp; Identity Protected</span>
      </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT LOGIC: REGISTRATION SUITE, THEME, AUDIO & FORM LOGIC           -->
  <!-- ========================================================================= -->
  <script>
    // --- 1. Audio Haptic Click Synthesizer (Native Web Audio API from about.html) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    // --- 2. Dark / Light Mode Toggle Management (Synchronized with localStorage) ---
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');

    function updateThemeUI(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        if (sunIcon) sunIcon.classList.remove('hidden');
        if (moonIcon) moonIcon.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        if (sunIcon) sunIcon.classList.add('hidden');
        if (moonIcon) moonIcon.classList.remove('hidden');
      }
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    updateThemeUI(savedTheme === 'dark');

    if (darkModeToggle) {
      darkModeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeUI(isDark);
        playClickSound();

        if (window.Motion && window.Motion.animate) {
          window.Motion.animate(darkModeToggle, {
            rotate: [0, -15, 15, 0],
            scale: [1, 0.9, 1.05, 1]
          }, { duration: 0.35 });
        }
      });
    }

    // --- 3. Right-to-Left (RTL) Toggle Management (Synchronized with localStorage) ---
    const rtlToggle = document.getElementById('rtl-toggle');

    function updateRtlUI(isRtl) {
      document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    }

    const savedDir = localStorage.getItem('dir') || 'ltr';
    updateRtlUI(savedDir === 'rtl');

    if (rtlToggle) {
      rtlToggle.addEventListener('click', () => {
        const currentDir = document.documentElement.getAttribute('dir') || 'ltr';
        const isRtl = currentDir === 'ltr';
        document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
        localStorage.setItem('dir', isRtl ? 'rtl' : 'ltr');
        updateRtlUI(isRtl);
        playClickSound();

        if (window.Motion && window.Motion.animate) {
          window.Motion.animate(rtlToggle, {
            rotate: [0, 180],
            scale: [1, 0.9, 1.05, 1]
          }, { duration: 0.35 });
        }
      });
    }

    // --- 4. Membership Role Pill Selection ---
    function setAccountRole(role) {
      playClickSound();
      document.getElementById('selected-role').value = role;
      
      const roles = ['buyer', 'seller', 'dealer'];
      roles.forEach(r => {
        const btn = document.getElementById(`role-${r}-btn`);
        if (btn) {
          if (r === role) {
            btn.classList.add('role-pill-active');
            btn.setAttribute('aria-checked', 'true');
            btn.classList.remove('text-slate-600', 'dark:text-slate-400');
          } else {
            btn.classList.remove('role-pill-active');
            btn.setAttribute('aria-checked', 'false');
            btn.classList.add('text-slate-600', 'dark:text-slate-400');
          }
        }
      });
    }

    // --- 5. Password Visibility Toggles ---
    function setupPasswordToggle(btnId, inputId, eyeId, eyeOffId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      const eyeOff = document.getElementById(eyeOffId);

      if (btn && input) {
        btn.addEventListener('click', () => {
          const isPassword = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPassword ? 'text' : 'password');
          if (eye && eyeOff) {
            if (isPassword) {
              eye.classList.add('hidden');
              eyeOff.classList.remove('hidden');
            } else {
              eye.classList.remove('hidden');
              eyeOff.classList.add('hidden');
            }
          }
          playClickSound();
        });
      }
    }
    setupPasswordToggle('toggle-reg-pass-btn', 'reg-password', 'eye-icon-1', 'eye-off-icon-1');
    setupPasswordToggle('toggle-reg-confirm-btn', 'reg-confirm-password', 'eye-icon-2', 'eye-off-icon-2');

    // --- 6. Live Password Strength Meter ---
    function checkPasswordStrength(password) {
      const label = document.getElementById('strength-label');
      const b1 = document.getElementById('bar-1');
      const b2 = document.getElementById('bar-2');
      const b3 = document.getElementById('bar-3');
      const b4 = document.getElementById('bar-4');
      const bars = [b1, b2, b3, b4];

      // Reset bars
      bars.forEach(b => {
        b.className = 'h-full rounded-full bg-slate-200 dark:bg-slate-800 transition-colors';
      });

      if (!password) {
        label.textContent = 'Password Strength: None';
        label.className = 'text-[10px] text-slate-500 dark:text-slate-400';
        return;
      }

      let score = 0;
      if (password.length >= 8) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      if (score === 1) {
        label.textContent = 'Password Strength: Weak';
        label.className = 'text-[10px] font-semibold text-rose-500';
        b1.className = 'h-full rounded-full bg-rose-500 transition-colors';
      } else if (score === 2) {
        label.textContent = 'Password Strength: Fair';
        label.className = 'text-[10px] font-semibold text-amber-500';
        b1.className = 'h-full rounded-full bg-amber-500 transition-colors';
        b2.className = 'h-full rounded-full bg-amber-500 transition-colors';
      } else if (score === 3) {
        label.textContent = 'Password Strength: Good';
        label.className = 'text-[10px] font-semibold text-cyan-500';
        b1.className = 'h-full rounded-full bg-cyan-500 transition-colors';
        b2.className = 'h-full rounded-full bg-cyan-500 transition-colors';
        b3.className = 'h-full rounded-full bg-cyan-500 transition-colors';
      } else if (score >= 4) {
        label.textContent = 'Password Strength: Strong & Secure';
        label.className = 'text-[10px] font-semibold text-emerald-500';
        bars.forEach(b => b.className = 'h-full rounded-full bg-emerald-500 transition-colors');
      }
    }

    // --- 7. Confirm Password Match Validation ---
    function validatePasswordMatch() {
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;
      const matchBadge = document.getElementById('match-status');

      if (confirmPass && pass === confirmPass) {
        matchBadge.classList.remove('hidden');
      } else {
        matchBadge.classList.add('hidden');
      }
    }

    // --- 8. Registration Form Submission ---
    function handleRegisterSubmit() {
      const name = document.getElementById('reg-name').value;
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;
      const role = document.getElementById('selected-role').value;
      const btn = document.getElementById('register-submit-btn');
      const text = document.getElementById('register-btn-text');

      if (pass !== confirmPass) {
        alert('[Password Mismatch] The entered passwords do not match. Please verify and retry.');
        document.getElementById('reg-confirm-password').focus();
        return;
      }

      playClickSound();
      btn.disabled = true;
      text.textContent = 'Validating Credentials & Encrypting...';

      setTimeout(() => {
        text.textContent = `Account Registered (${role.toUpperCase()})!`;
        btn.classList.add('bg-emerald-500');

        setTimeout(() => {
          alert(`[Welcome to AutoNexus] Member account created for ${name} as a verified ${role}! Redirecting to login...`);
          window.location.href = 'login.html';
        }, 350);
      }, 750);
    }

    // --- 9. Social Registration Simulation ---
    function handleSocialRegister(provider) {
      playClickSound();
      alert(`[${provider} Single Sign-On] Establishing encrypted OAuth2 tunnel with ${provider}... Onboarding verified!`);
    }

    // --- 10. Framer Motion Entrance Animation Suite ---
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Motion && window.Motion.animate) {
        const { animate, spring } = window.Motion;

        // Animate Registration Card Entrance
        animate('#register-card', {
          opacity: [0, 1],
          transform: ['scale(0.92) translateY(24px)', 'scale(1) translateY(0px)']
        }, {
          duration: 0.65,
          easing: spring({ stiffness: 240, damping: 20 })
        });

        // Stagger Form Controls
        animate('#register-form > div', {
          opacity: [0, 1],
          transform: ['translateY(12px)', 'translateY(0px)']
        }, {
          delay: window.Motion.stagger(0.08, { start: 0.2 }),
          duration: 0.45
        });
      }
    });
  </script>

</body>
